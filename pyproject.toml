[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "abides-marl-experiments"
version = "0.1.0"
description = "ABIDES-MARL experiments: recreation of Cheridiko, Dupret & Wu (arXiv:2511.02016)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "torch>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
gpu = []

[tool.uv]
dev-dependencies = [
    "ipython>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["analysis*", "experiments*"]

[tool.ruff]
line-length = 100
target-version = "py312"
