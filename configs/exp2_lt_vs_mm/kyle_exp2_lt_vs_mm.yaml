  # Noise trader
  - id: noise
    type: KyleNoiseTrader
    train: false
    eval: false
    decision_dt: 1.0
    params:
      sigma_u: 50.0

  # Liquidity trader
  - id: lt
    type: KyleLiquidityTrader
    train: true
    eval: true
    decision_dt: 1.0
    params:
      q_target: 1000
      phi: 0.01
      beta_penalty: 10.0
      sim_duration: 20.0
      n_steps: 20
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64

train:
  total_timesteps: 20000
  eval_freq: 5000
  eval_episodes: 30
  checkpoint_freq: 5000
