mode: train
seed: 42

environment:
  ref_price: 1000
  tick_size: 1
  lot_size: 1
  env_dt: 1.0
  sim_duration: 20.0
  generator:
    type: ema_ou
    spread_ticks: 2
    levels: 1
    inner_levels: 0
    base_qty: 1
    qty_decay: 0.0
    level_spacing: 1
    inner_drift_threshold: 0
    requote_secs: 1.0
    rand_price_pct: 0.0
    rand_qty_pct: 0.0
    ema_alpha: 1.0
    ema_sigma: 0.0
    flow_kappa: 0.0
    flow_sigma: 0.0
    flow_eta: 0.0
    impact_coeff: 0.0
    ema_halflife: 100.0
    mo_intensity: 0.0
    mo_size: 0
    mo_threshold: 0.0

agents:
  - id: mm_coordinator
    type: KyleMMCoordinator
    train: false
    eval: false
    decision_dt: 1.0
  # 20 Market Makers
  - id: mm_0
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: &mm_params
      policy: linear
      max_spread_ticks: 50
      max_size: 10
      inventory_penalty: 0.0
      sim_duration: 20.0
      n_steps: 20
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64

  - id: mm_1
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: *mm_params

  - id: mm_2
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: *mm_params

  - id: mm_3
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: *mm_params

  - id: mm_4
