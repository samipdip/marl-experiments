mode: eval
seed: 42

environment:
  ref_price: 1300
  tick_size: 1
  lot_size: 1
  env_dt: 1.0
  sim_duration: 20.0
  generator:
    type: ema_ou
    spread_ticks: 4
    levels: 5
    inner_levels: 0
    base_qty: 20
    qty_decay: 0.8
    level_spacing: 1
    inner_drift_threshold: 0
    requote_secs: 1.0
    rand_price_pct: 0.0
    rand_qty_pct: 0.0
    ema_alpha: 1.0
    ema_sigma: 0.0
    flow_kappa: 0.0
    flow_sigma: 0.0
    flow_eta: 0.0
    impact_coeff: 0.0
    ema_halflife: 100.0
    mo_intensity: 0.0
    mo_size: 0
    mo_threshold: 0.0

agents:
  - id: mm_coordinator
    type: KyleMMCoordinator
    train: false
    eval: false
    decision_dt: 1.0
  - id: mm_0
    type: KyleMarketMaker
    train: false
    eval: false
    decision_dt: 1.0
    checkpoint: results/exp1_mm_update/checkpoints/mm_0_step_60000.pt
    params: &mm_params
      policy: linear
      max_depth: 500
      sim_duration: 20.0
      n_steps: 20
  - id: mm_1
    type: KyleMarketMaker
    train: false
    eval: false
    decision_dt: 1.0
    checkpoint: results/exp1_mm_update/checkpoints/mm_1_step_60000.pt
    params: *mm_params
