mode: train
seed: 42

environment:
  ref_price: 1000
  ref_price_range: [500, 1500]
  tick_size: 1
  lot_size: 1
  env_dt: 1.0
  sim_duration: 20.0
  generator:
    type: ema_ou
    spread_ticks: 4
    levels: 5
    inner_levels: 0
    base_qty: 200
    qty_decay: 0.8
    level_spacing: 1
    inner_drift_threshold: 0
    requote_secs: 1.0
    rand_price_pct: 0.0
    rand_qty_pct: 0.0
    ema_alpha: 1.0
    ema_sigma: 0.0
    flow_kappa: 0.0
    flow_sigma: 0.0
    flow_eta: 0.0
    impact_coeff: 0.0
    ema_halflife: 100.0
    mo_intensity: 0.0
    mo_size: 0
    mo_threshold: 0.0

agents:
  - id: mm_coordinator
    type: KyleMMCoordinator
    train: false
    eval: false
    decision_dt: 1.0
  - id: mm_0
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: &mm_params
      policy: linear
      max_depth: 500
      sim_duration: 20.0
      n_steps: 20
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64
      spread_k: 500
  - id: mm_1
    type: KyleMarketMaker
    train: true
    eval: false
    decision_dt: 1.0
    params: *mm_params

  # Noise trader
  - id: noise
    type: KyleNoiseTrader
    train: false
    eval: false
    decision_dt: 1.0
    params:
      sigma_u: 50.0

  # Informed trader
  - id: informed
    type: KyleInformedTrader
    train: true
    eval: true
    decision_dt: 1.0
    params:
      policy: linear
      mu_v: 1000.0
      sigma_v: 100.0
      max_order: 500
      sim_duration: 20.0
      n_steps: 20
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64

train:
  total_timesteps: 60000
  eval_freq: 10000
  eval_episodes: 30
  checkpoint_freq: 10000
