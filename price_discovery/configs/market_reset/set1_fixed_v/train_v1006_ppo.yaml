      kappa_ref: 0.8
      q_min: -20
      q_max: 20
      hjb_dt: 1.0
      lambda_ema_decay: 0.3
      n_lob_levels: 5
      tag_start: 60000
      n_steps: 80
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64
      mode: train
