mode: eval
seed: 42

environment:
  ref_price: 1000
  tick_size: 1
  lot_size: 1
  env_dt: 1.0
  sim_duration: 60.0

agents:
  - id: uniform_mm
    type: UniformMarketMakers
    train: false
    eval: false
    decision_dt: 1.0
    params:
      n_makers: 5
      min_depth: 1
      max_depth: 5
      qty: 1
      ref_price: 1000.0
      tick: 1.0
      tag_start: 40000

  - id: noise
    type: PoissonNoiseTrader
    train: false
    eval: false
    decision_dt: 1.0
    params:
      lambda_plus: 1.0
      lambda_minus: 1.0
      qty: 1
      dt: 1.0

  - id: hjb_mm
    type: HjbMarketMaker
    train: false
    eval: false
    decision_dt: 1.0
    params:
      kappa_plus: 0.8
      kappa_minus: 0.8
      lambda_plus: 1.0
      lambda_minus: 1.0
      alpha: 0.01
      phi: 0.001
      q_min: -20
      q_max: 20
      lot_size: 1
      N: 60
      sim_duration: 60.0
      hjb_dt: 1.0
      episode_steps: 60
      tag_start: 50000

  - id: informed
    type: KyleInformedTrader
    train: false
    eval: true
    decision_dt: 1.0
    checkpoint: /home/samip/checkpoints/price_discovery_train_60/informed_step_20029_final.pt
    params:
      policy: linear
      max_order: 500
      sim_duration: 60.0
      n_steps: 60
      mode: eval
      total_timesteps: 0
      eval_freq: 0
      buy_only: true
      checkpoint_freq: 0
