mode: train
seed: 42

environment:
  ref_price: 1000
  tick_size: 1
  lot_size: 1
  env_dt: 1.0
  sim_duration: 25000.0

agents:
  - id: uniform_mm
    type: UniformMarketMakers
    train: false
    eval: false
    decision_dt: 1.0
    params:
      n_makers: 5
      min_depth: 1
      max_depth: 5
      qty: 1
      ref_price: 1000.0
      tick: 1.0
      tag_start: 40000

  - id: noise
    type: PoissonNoiseTrader
    train: false
    eval: false
    decision_dt: 1.0
    params:
      lambda_plus: 1.0
      lambda_minus: 1.0
      qty: 1
      dt: 1.0

  - id: hjb_mm
    type: HjbMarketMaker
    train: false
    eval: false
    decision_dt: 1.0
    params:
      kappa_plus: 0.8
      kappa_minus: 0.8
      lambda_plus: 1.0
      lambda_minus: 1.0
      alpha: 0.01
      phi: 0.001
      q_min: -20
      q_max: 20
      lot_size: 1
      N: 60
      sim_duration: 60.0
      hjb_dt: 1.0
      episode_steps: 60
      tag_start: 50000

  - id: informed
    type: KyleInformedTrader
    train: true
    eval: true
    decision_dt: 1.0
    params:
      policy: linear
      max_order: 500
      sim_duration: 25000.0
      n_steps: 60
      lr: 0.0003
      gamma: 1.0
      gae_lambda: 1.0
      clip_epsilon: 0.2
      entropy_coef: 0.01
      n_epochs: 10
      batch_size: 64
      mode: train
      total_timesteps: 20000
      eval_freq: 20000
      eval_episodes: 30
      checkpoint_freq: 5000
      results_dir: /home/samip/checkpoints/price_discovery_train_60
      buy_only: true
      checkpoint_dir: /home/samip/checkpoints/price_discovery_train_60

train:
  total_timesteps: 20000
  eval_freq: 20000
  eval_episodes: 30
  checkpoint_freq: 5000
